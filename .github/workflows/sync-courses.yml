name: Sync IHI Courses

on:
  schedule:
    - cron: "0 8 * * 1"  # Every Monday at 8 AM UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: brainsait-ihi-pipeline
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Scrape latest courses
        run: node scripts/scrape-ihi-courses.mjs

      - name: Generate site
        run: node scripts/generate-site.mjs

      - name: Commit and push updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: sync IHI courses $(date +%Y-%m-%d)"
            git push
          fi
