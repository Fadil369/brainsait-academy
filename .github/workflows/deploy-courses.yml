name: Deploy Courses to CF Pages

on:
  push:
    branches: [main]
    paths:
      - "courses/**"

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744

      - name: Setup Node
        uses: actions/setup-node@3235b876344d2a9aa001b8d1453c930bba69e610
        with:
          node-version: "18"

      - name: Generate HTML pages
        run: |
          npm install gray-matter@4.0.3 showdown@2.1.0
          node scripts/generate-html.js

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@f0a1cd58cd66095dee69bfa18fa5efd1dde93bca
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          projectName: brainsait-academy
          directory: build
          productionBranch: main
