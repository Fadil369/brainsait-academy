name: Deploy BrainSAIT Academy

on:
  push:
    branches: [main]
    paths:
      - "brainsait-ihi-pipeline/courses/**"
      - "brainsait-ihi-pipeline/scripts/**"
      - "brainsait-ihi-pipeline/pipeline.ts"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: brainsait-ihi-pipeline
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: brainsait-ihi-pipeline/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate site
        run: node scripts/generate-site.mjs

      - name: Build pipeline
        run: npm run build

      - name: Run smoke test
        run: npm test

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command: pages deploy dist/site --project-name brainsait-academy --branch main

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: brainsait-academy-site
          path: brainsait-ihi-pipeline/dist/site
          retention-days: 30
