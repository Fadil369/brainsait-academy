name: BrainSAIT IHI pipeline

on:
  push:
    branches:
      - main
      - copilot/**
  pull_request:
  workflow_dispatch:

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: brainsait-ihi-pipeline

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: brainsait-ihi-pipeline/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build and smoke-test pipeline
        run: npm test

      - name: Upload preview artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: brainsait-ihi-preview
          path: brainsait-ihi-pipeline/dist/site

      - name: Deploy preview to Cloudflare Pages
        if: ${{ github.event_name == 'workflow_dispatch' && secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' && secrets.CLOUDFLARE_PAGES_PROJECT_NAME != '' }}
        uses: cloudflare/wrangler-action@v3.15.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist/site --project-name ${{ secrets.CLOUDFLARE_PAGES_PROJECT_NAME }}
